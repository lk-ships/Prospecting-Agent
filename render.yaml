services:
  - type: web
    name: prospecting-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CREDENTIALS_BASE64
        sync: false
      - key: SECRET_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
